name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API dependencies
        run: npm install

      - name: Check API syntax
        run: npm run check

      - name: Install dashboard dependencies
        working-directory: client
        run: npm install

      - name: Build dashboard
        working-directory: client
        run: npm run build
